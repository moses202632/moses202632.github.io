<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>MOSES LEE — Designer Portfolio</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  /* Hide platform watermark / badge */
  [class*="watermark"],
  [id*="watermark"],
  [class*="miaoda-badge"],
  [id*="miaoda-badge"],
  [class*="powered-by"],
  [id*="powered-by"],
  [class*="doubao"],
  [id*="doubao"] {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
  body {
    font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
    background: #0a0a0a;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; height: auto; display: block; }
  ::selection { background: #FF5722; color: #fff; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FF3D00, #FF9100); border-radius: 3px; }

  /* Utility */
  .gradient-text {
    background: linear-gradient(135deg, #FF3D00 0%, #FF9100 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .glass {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Splash */
  .splash {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transition: opacity 0.8s ease, transform 1.2s ease;
  }
  .splash.hide { opacity: 0; transform: scale(1.15); pointer-events: none; }
  .splash-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 120px);
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #FFD700 0%, #FF6B00 50%, #FF1744 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: splashGlow 2s ease-in-out infinite alternate;
  }
  @keyframes splashGlow {
    from { filter: drop-shadow(0 0 10px rgba(255,107,0,0.5)); }
    to   { filter: drop-shadow(0 0 30px rgba(255,23,68,0.8)); }
  }
  .splash-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(255,107,0,0.2);
    border-top-color: #FF6B00;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-top: 30px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash-particles {
    position: absolute; inset: 0;
    overflow: hidden; pointer-events: none;
  }
  .splash-particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle, #FF6B00 0%, transparent 70%);
    animation: floatUp 3s ease-out infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(2); opacity: 0; }
  }

  /* Navbar */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 40px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.3s ease, padding 0.3s ease;
  }
  .navbar.scrolled {
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px);
    padding: 14px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  .nav-logo span { color: #FF5722; }
  .nav-links {
    display: flex; gap: 40px; list-style: none;
  }
  .nav-links a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    position: relative;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: #FF5722; }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 2px;
    background: linear-gradient(90deg, #FF3D00, #FF9100);
    transition: width 0.3s;
  }
  .nav-links a:hover::after { width: 100%; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .gear-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .gear-btn:hover {
    background: rgba(255,87,34,0.2);
    border-color: rgba(255,87,34,0.4);
    transform: rotate(45deg);
  }
  .contact-btn {
    padding: 10px 24px;
    border-radius: 30px;
    background: linear-gradient(135deg, #FF3D00 0%, #FF9100 100%);
    color: #fff;
    border: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(255,61,0,0.3);
  }
  .contact-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(255,61,0,0.5);
  }
  .mobile-menu-btn {
    display: none;
    width: 40px; height: 40px;
    background: transparent;
    border: none;
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .mobile-menu-btn span {
    display: block; width: 22px; height: 2px;
    background: #fff; transition: 0.3s;
  }

  /* Hero */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-image: url('assets/hero_bg.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.7) 60%, #0a0a0a 100%);
  }
  .hero-content {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column;
    padding: 120px 60px 60px;
  }
  .hero-title-wrap {
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    position: relative;
  }
  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 14vw, 200px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .hero-title .line1 { display: block; }
  .hero-title .line2 { display: block; padding-left: 15%; }
  .hero-slash {
    position: absolute;
    top: 20px; right: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 10vw, 140px);
    color: #FF5722;
    line-height: 1;
    transform: skewX(-10deg);
  }
  .hero-slash small {
    display: block;
    font-size: 0.3em;
    color: rgba(255,255,255,0.5);
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.2em;
    margin-top: 8px;
    transform: skewX(10deg);
  }
  .hero-tagline {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: clamp(14px, 1.5vw, 18px);
    color: #FF9100;
    letter-spacing: 0.3em;
    margin-top: 24px;
    text-align: center;
    font-weight: 300;
  }
  .hero-works {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 24px;
    max-width: 1400px;
    width: 100%;
    margin: 60px auto 0;
  }
  .hero-work-card {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    cursor: pointer;
    aspect-ratio: 16/10;
    transition: transform 0.5s ease;
  }
  .hero-work-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }
  .hero-work-card:hover img { transform: scale(1.05); }
  .hero-work-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.8) 100%);
  }
  .hero-work-info {
    position: absolute; bottom: 24px; left: 24px; right: 24px;
    z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .hero-work-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 1;
    color: #fff;
  }
  .hero-work-label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .hero-work-desc {
    max-width: 180px;
    text-align: right;
  }
  .hero-work-desc p {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .hero-work-btn {
    display: inline-flex;
    align-items: center; gap: 6px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #FF3D00, #FF9100);
    border: none;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
  }
  .hero-work-btn:hover { transform: translateX(4px); }

  /* Section common */
  .section {
    padding: 120px 60px;
    position: relative;
  }
  .section-header {
    max-width: 1400px;
    margin: 0 auto 60px;
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
  }
  .section-label {
    font-size: 13px;
    color: #FF5722;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 6vw, 80px);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  /* About */
  .about-section { background: #0a0a0a; }
  .about-grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 60px;
    align-items: start;
  }
  .about-portrait-wrap {
    position: sticky;
    top: 120px;
  }
  .about-portrait {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 3/4;
  }
  .about-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: contrast(1.05) saturate(1.1);
  }
  .about-portrait::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(10,10,10,0.8) 100%);
  }
  .about-portrait-accent {
    position: absolute;
    top: 20px; right: 20px;
    width: 80px; height: 80px;
    border: 2px solid #FF5722;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .about-portrait-accent span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: #FF5722;
  }
  .about-info-card {
    margin-top: 20px;
    padding: 24px;
    border-radius: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .info-item .info-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .info-item .info-value {
    font-size: 15px;
    color: #fff;
    font-weight: 500;
  }
  .about-bio {
    font-size: 16px;
    line-height: 1.8;
    color: rgba(255,255,255,0.7);
    margin-bottom: 40px;
  }
  .about-bio strong { color: #fff; }

  /* Timeline */
  .timeline { position: relative; padding-left: 30px; }
  .timeline::before {
    content: ''; position: absolute;
    left: 8px; top: 8px; bottom: 8px;
    width: 1px;
    background: linear-gradient(180deg, #FF3D00, #FF9100, transparent);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 32px;
  }
  .timeline-item::before {
    content: ''; position: absolute;
    left: -26px; top: 6px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #FF5722;
    box-shadow: 0 0 10px #FF5722;
  }
  .timeline-year {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: #FF9100;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .timeline-company {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }
  .timeline-role {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
  }

  /* Works */
  .works-section { background: #0d0d0d; }
  .works-filter {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .filter-chip {
    padding: 8px 20px;
    border-radius: 20px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .filter-chip:hover {
    border-color: rgba(255,87,34,0.5);
    color: #FF9100;
  }
  .filter-chip.active {
    background: linear-gradient(135deg, #FF3D00, #FF9100);
    border-color: transparent;
    color: #fff;
  }
  .works-masonry {
    max-width: 1400px;
    margin: 0 auto;
    columns: 3;
    column-gap: 20px;
  }
  .work-item {
    break-inside: avoid;
    margin-bottom: 20px;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s ease;
  }
  .work-item:hover { transform: translateY(-6px); }
  .work-item img {
    width: 100%;
    display: block;
    transition: transform 0.5s ease;
  }
  .work-item:hover img { transform: scale(1.05); }
  .work-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.9) 100%);
    opacity: 0;
    transition: opacity 0.4s;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 24px;
  }
  .work-item:hover .work-overlay { opacity: 1; }
  .work-cat {
    font-size: 11px;
    color: #FF9100;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .work-title {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .work-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }
  .work-view-btn {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,87,34,0.9);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.3s;
  }
  .work-item:hover .work-view-btn {
    opacity: 1;
    transform: scale(1);
  }

  /* Work Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content {
    max-width: 1200px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: #111;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    animation: modalIn 0.4s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    transition: 0.3s;
  }
  .modal-close:hover { background: rgba(255,87,34,0.8); }
  .modal-image {
    width: 100%;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }
  .modal-body {
    padding: 40px;
  }
  .modal-cat {
    font-size: 12px;
    color: #FF9100;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
  }
  .modal-desc {
    font-size: 15px;
    line-height: 1.8;
    color: rgba(255,255,255,0.6);
    margin-bottom: 24px;
  }
  .modal-tags {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .modal-tag {
    padding: 6px 14px;
    background: rgba(255,87,34,0.1);
    border: 1px solid rgba(255,87,34,0.3);
    border-radius: 20px;
    font-size: 12px;
    color: #FF9100;
    letter-spacing: 0.05em;
  }

  /* Skills */
  .skills-section { background: #0a0a0a; }
  .skills-grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 24px;
  }
  .skill-card {
    padding: 32px 24px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }
  .skill-card::before {
    content: ''; position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #FF5722, transparent);
    transition: left 0.6s;
  }
  .skill-card:hover {
    border-color: rgba(255,87,34,0.3);
    background: rgba(255,87,34,0.04);
    transform: translateY(-4px);
  }
  .skill-card:hover::before { left: 100%; }
  .skill-icon {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,61,0,0.15), rgba(255,145,0,0.15));
    color: #FF9100;
  }
  .skill-name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }
  .skill-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    line-height: 1.5;
  }

  /* Contact */
  .contact-section {
    background: linear-gradient(180deg, #0a0a0a 0%, #110805 100%);
    position: relative;
    overflow: hidden;
  }
  .contact-section::before {
    content: ''; position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,61,0,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .contact-grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    position: relative;
    z-index: 2;
  }
  .contact-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 120px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    margin-bottom: 24px;
  }
  .contact-subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    line-height: 1.8;
    margin-bottom: 40px;
    max-width: 400px;
  }
  .contact-info-list { list-style: none; }
  .contact-info-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .contact-info-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,87,34,0.1);
    display: flex; align-items: center; justify-content: center;
    color: #FF9100;
    flex-shrink: 0;
  }
  .contact-info-text .ci-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (miaoda:tweaks:set-keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*'); } catch (e) { /* no parent — ignore */ }
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts miaoda:tweaks:dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes miaoda:tweaks:deactivate back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // x = distance from the viewport's right edge, y = distance from its TOP.
  // The panel anchors top-right (right/top in CSS) so it clears the host's
  // bottom toolbar; both axes still grow inward, so clamp/drag math is
  // symmetric with the old bottom-right anchor.
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*'); } catch (e) { /* no parent — ignore */ }
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*'); } catch (e) { /* no parent — ignore */ }
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-miaoda-chrome=""
           style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~244px (280 panel − 32 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 12px system-ui averages ~6.6px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

TweaksPanel.dcOverlay = true;

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,

  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts miaoda:tweaks:chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <ClaudeSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [items.join('\n')]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

// ============== Splash Screen ==============
function Splash({ onComplete }) {
  const [hide, setHide] = useState(false);
  useEffect(() => {
    const timer = setTimeout(() => {
      setHide(true);
      setTimeout(onComplete, 1200);
    }, 2800);
    return () => clearTimeout(timer);
  }, [onComplete]);

  const particles = Array.from({ length: 20 }, (_, i) => ({
    left: Math.random() * 100,
    delay: Math.random() * 3,
    duration: 2 + Math.random() * 2,
    size: 2 + Math.random() * 4
  }));

  return (
    <div className={`splash ${hide ? 'hide' : ''}`}>
      <div className="splash-particles">
        {particles.map((p, i) => (
          <div
            key={i}

function PublishModal({ isOpen, onClose, shareUrl }) {
  const [copied, setCopied] = useState(false);

  if (!isOpen) return null;

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
    } catch {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = shareUrl;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="publish-modal" onClick={(e) => e.stopPropagation()}>

// ============== Element Property Editor (floating) ==============
function ElementPropertyPanel({ element, onClose, onColorChange, onFontSizeChange, onReplaceImage, editMode }) {
  const [localColor, setLocalColor] = useState('#ffffff');
  const [localFontSize, setLocalFontSize] = useState(16);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (element) {
      const cs = getComputedStyle(element);
      setLocalColor(cs.color);
      const fs = parseFloat(cs.fontSize);
      setLocalFontSize(Math.round(fs));
    }
  }, [element]);

  if (!element || !editMode) return null;

  const isImage = element.tagName === 'IMG' || element.querySelector('img');
  const rect = element.getBoundingClientRect();
  const panelTop = Math.min(rect.bottom + 10, window.innerHeight - 200);
  const panelLeft = Math.min(rect.left, window.innerWidth - 280);

  const handleColor = (e) => {
    const color = e.target.value;
    setLocalColor(color);
    element.style.color = color;
    onColorChange(element, color);
  };

  const handleFontSize = (e) => {
    const size = Number(e.target.value);
    setLocalFontSize(size);
    element.style.fontSize = `${size}px`;
    onFontSizeChange(element, size);
  };

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = element.tagName === 'IMG' ? element : element.querySelector('img');
        if (img) {
          img.src = ev.target.result;
          onReplaceImage(element, ev.target.result);
        }
      };
      if (file.type.startsWith('video/')) {
        // Video replacement: replace img with video element
        reader.onload = (ev) => {
          const img = element.tagName === 'IMG' ? element : element.querySelector('img');
          if (img) {
            const video = document.createElement('video');
            video.src = ev.target.result;
            video.controls = true;
            video.loop = true;
            video.muted = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            img.parentNode.replaceChild(video, img);
            onReplaceImage(element, ev.target.result);
          }
        };
      }
      reader.readAsDataURL(file);
    }
    e.target.value = '';
  };

  return (
    <div
      className="element-prop-panel"
      style={{ top: `${panelTop + window.scrollY}px`, left: `${panelLeft}px` }}
      onClick={(e) => e.stopPropagation()}
    >
      <div className="prop-header">
        <span>元素属性</span>
        <button onClick={onClose} className="prop-close">{Icons.close}</button>
      </div>
      <div className="prop-body">
        {!isImage && (
          <>
            <div className="prop-row">
              <label>文字颜色</label>
              <input type="color" value={rgbToHex(localColor)} onChange={handleColor} />
            </div>
            <div className="prop-row">
              <label>字号: {localFontSize}px</label>
              <input type="range" min="10" max="200" value={localFontSize} onChange={handleFontSize} />
            </div>
          </>
        )}
        {isImage && (
          <div className="prop-row">
            <label>替换图片/视频</label>
            <div className="replace-img-btn" onClick={() => fileInputRef.current?.click()}>
              {Icons.upload}
              <span>点击上传图片或视频</span>
            </div>
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*,video/*"
              style={{ display: 'none' }}
              onChange={handleImageUpload}
            />
          </div>
        )}
        <div className="prop-row prop-hint">
          <div style={{ display: 'flex', alignItems: 'center', gap: '6px', color: '#FF9100' }}>
            {Icons.move}
            <span style={{ fontSize: 11 }}>拖动元素可调整位置</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// Helper: rgb string to hex
function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  const match = rgb.match(/\d+/g);
  if (!match) return '#ffffff';
  const [r, g, b] = match.map(Number);
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

          <div className="theme-options">
            {themes.map(t => (
              <div
                key={t.id}
                className={`theme-option ${theme === t.id ? 'active' : ''}`}
                onClick={() => setTheme(t.id)}
              >
                <div className="theme-preview" style={{
                  background: `linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]})`
                }}></div>
                <div className="theme-name">{t.name}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="edit-section">
          <div className="edit-section-title">自定义颜色</div>
          <div className="edit-row">
            <label>主色调</label>
            <input
              type="color"
              value={primaryColor}
              onChange={(e) => setPrimaryColor(e.target.value)}
            />
          </div>
          <div className="edit-row">
            <label>基准字号: {fontSize}px</label>
            <input
              type="range"
              min="12"
              max="20"
              value={fontSize}
              onChange={(e) => setFontSize(Number(e.target.value))}
            />
          </div>
        </div>

        <div className="edit-section">
          <div className="edit-section-title">上传作品</div>
          <div className="upload-area" onClick={() => fileInputRef.current?.click()}>
            <div style={{ color: '#FF9100' }}>{Icons.upload}</div>
            <p>点击上传作品图片</p>
            <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)' }}>支持 JPG / PNG，单张不超过 5MB</p>
          </div>
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            style={{ display: 'none' }}
            onChange={(e) => {
              const file = e.target.files[0];
              if (file) onUploadWork(file);
              e.target.value = '';
            }}
          />
          {customWorks.length > 0 && (
            <div style={{ marginTop: 16, fontSize: 12, color: 'rgba(255,255,255,0.5)' }}>
              已上传 {customWorks.length} 张作品
            </div>
          )}
        </div>

        <div className="edit-section">
          <div className="edit-section-title">编辑操作说明</div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.6)', lineHeight: 2 }}>
            <div>• <strong style={{ color: '#FF9100' }}>双击文字</strong> 直接编辑内容</div>
            <div>• <strong style={{ color: '#FF9100' }}>单击选中</strong> 元素改颜色/字号</div>
            <div>• <strong style={{ color: '#FF9100' }}>拖动元素</strong> 调整位置</div>
            <div>• <strong style={{ color: '#FF9100' }}>选中图片</strong> 可替换为图片/视频</div>
            <div>• 修改自动保存，刷新不丢失</div>
          </div>
        </div>
      </div>
      <div className="edit-panel-footer">
        <button className="btn-cancel" onClick={onCancel}>取消</button>
        <button className="btn-publish" onClick={onPublish}>
          {Icons.share}
          <span>发布预览</span>
        </button>
        <button className="btn-done" onClick={onSave}>完成</button>
      </div>
    </div>
  );
}

// ============== Main App ==============
function App() {
  // Preview mode check - from URL param
  const [previewMode, setPreviewMode] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('preview') === '1';
  });
  // Owner mode check - editing UI is only shown to the owner (?edit=1)
  const [ownerMode, setOwnerMode] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('edit') === '1';
  });

  const [showSplash, setShowSplash] = useState(true);
  const [scrolled, setScrolled] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editPanelOpen, setEditPanelOpen] = useState(false);
  const [selectedWork, setSelectedWork] = useState(null);
  const [worksFilter, setWorksFilter] = useState('all');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [publishOpen, setPublishOpen] = useState(false);

  // Selected element for property panel
  const [selectedElement, setSelectedElement] = useState(null);

  // Theme state with localStorage
  const [theme, setThemeState] = useState(() => {
    const saved = localStorage.getItem('moses_theme');
    return saved || 'red-black';
  });
  const [primaryColor, setPrimaryColorState] = useState(() => {
    const saved = localStorage.getItem('moses_primaryColor');
    return saved || '#FF5722';
  });
  const [fontSize, setFontSizeState] = useState(() => {
    const saved = localStorage.getItem('moses_fontSize');
    return saved ? Number(saved) : 16;
  });
  const [customWorks, setCustomWorks] = useState(() => {
    const saved = localStorage.getItem('moses_customWorks');
    return saved ? JSON.parse(saved) : [];
  });
  const [editableContent, setEditableContent] = useState(() => {
    const saved = localStorage.getItem('moses_editableContent');
    return saved ? JSON.parse(saved) : {};
  });
  const [elementStyles, setElementStyles] = useState(() => {
    const saved = localStorage.getItem('moses_elementStyles');
    return saved ? JSON.parse(saved) : {};
  });
  const [imageReplacements, setImageReplacements] = useState(() => {
    const saved = localStorage.getItem('moses_imageReplacements');
    return saved ? JSON.parse(saved) : {};
  });

  // Share URL
  const shareUrl = `${window.location.origin}${window.location.pathname}?preview=1`;

  // Apply theme
  useEffect(() => {
    let primary, secondary;
    switch (theme) {
      case 'cyber':
        primary = '#7C3AED'; secondary = '#06B6D4'; break;
      case 'nature':
        primary = '#10B981'; secondary = '#84CC16'; break;
      default:
        primary = '#FF3D00'; secondary = '#FF9100';
    }
    const styleEl = document.getElementById('theme-style');
    const css = `
      .gradient-text { background: linear-gradient(135deg, ${primary} 0%, ${secondary} 100%); -webkit-background-clip: text; background-clip: text; }
      .contact-btn, .hero-work-btn, .submit-btn, .btn-done, .btn-publish, .filter-chip.active, .copy-btn { background: linear-gradient(135deg, ${primary}, ${secondary}) !important; }
      .gear-btn:hover { background: rgba(130,130,130,0.2); border-color: ${primary}80; }
      .nav-logo span { color: ${primary}; }
      .footer-logo span { color: ${primary}; }
      .section-label, .hero-tagline, .timeline-year, .modal-cat, .edit-section-title { color: ${secondary}; }
      .hero-slash { color: ${primary}; }
      .timeline-item::before { background: ${primary}; box-shadow: 0 0 10px ${primary}; }
      .timeline::before { background: linear-gradient(180deg, ${primary}, ${secondary}, transparent); }
      .skill-icon { color: ${secondary}; background: linear-gradient(135deg, ${primary}22, ${secondary}22); }
      .skill-card:hover { border-color: ${primary}4d; background: ${primary}0a; }
      .skill-card::before { background: linear-gradient(90deg, transparent, ${primary}, transparent); }
      .modal-tag { background: ${primary}1a; border-color: ${primary}4d; color: ${secondary}; }
      .contact-info-icon { background: ${primary}1a; color: ${secondary}; }
      .theme-option.active { border-color: ${primary}; }
      .nav-links a:hover { color: ${primary}; }
      .nav-links a::after { background: linear-gradient(90deg, ${primary}, ${secondary}); }
      .work-cat { color: ${secondary}; }
      .work-view-btn { background: ${primary}e6; }
      .splash-logo { background: linear-gradient(135deg, ${secondary}99 0%, ${primary} 50%, ${secondary} 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .splash-ring { border-top-color: ${primary}; }
      .about-portrait-accent { border-color: ${primary}; }
      .about-portrait-accent span { color: ${primary}; }
      .contact-section::before { background: radial-gradient(circle, ${primary}26 0%, transparent 70%); }
      .form-group input:focus, .form-group textarea:focus { border-color: ${primary}; background: ${primary}0d; }
      .publish-icon { color: ${secondary}; background: linear-gradient(135deg, ${primary}22, ${secondary}22); }
      .tip-dot { background: ${primary}; }
      .editable-hint { background: ${primary}e6; }
      .replace-img-btn:hover { border-color: ${primary}; background: ${primary}10; }
    `;
    if (styleEl) {
      styleEl.textContent = css;
    } else {
      const s = document.createElement('style');
      s.id = 'theme-style';
      s.textContent = css;
      document.head.appendChild(s);
    }
    if (!previewMode) {
      localStorage.setItem('moses_theme', theme);
    }
  }, [theme, previewMode]);

  useEffect(() => {
    document.body.style.fontSize = `${fontSize}px`;
    if (!previewMode) localStorage.setItem('moses_fontSize', fontSize);
  }, [fontSize, previewMode]);

  useEffect(() => {
    if (!previewMode) localStorage.setItem('moses_primaryColor', primaryColor);
  }, [primaryColor, previewMode]);

  // Scroll handler
  useEffect(() => {
    const handleScroll = () => setScrolled(window.scrollY > 50);
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  // Apply saved element styles and image replacements on load
  useEffect(() => {
    if (showSplash) return;
    // Apply element styles
    Object.entries(elementStyles).forEach(([key, style]) => {
      const el = document.querySelector(`[data-style-key="${key}"]`);
      if (el) {
        if (style.color) el.style.color = style.color;
        if (style.fontSize) el.style.fontSize = `${style.fontSize}px`;
        if (style.transform) el.style.transform = style.transform;
      }
    });
    // Apply image replacements
    Object.entries(imageReplacements).forEach(([key, src]) => {
      const container = document.querySelector(`[data-editable-image="${key}"]`);
      if (container) {
        const img = container.querySelector('img');
        if (img) img.src = src;
      }
    });
  }, [showSplash, elementStyles, imageReplacements]);

  // Assign style keys to editable elements after load
  useEffect(() => {
    if (showSplash) return;
    const editables = document.querySelectorAll('[data-editable]');
    editables.forEach((el, idx) => {
      if (!el.getAttribute('data-style-key')) {
        el.setAttribute('data-style-key', `el_${el.getAttribute('data-editable') || idx}`);
      }
    });
  }, [showSplash]);

  // Double-click to edit text (edit mode only)
  useEffect(() => {
    if (!editMode || previewMode) return;
    const handleDoubleClick = (e) => {
      const target = e.target.closest('[data-editable]');
      if (target) {
        target.contentEditable = 'true';
        target.focus();
        e.stopPropagation();
      }
    };
    document.addEventListener('dblclick', handleDoubleClick);
    return () => document.removeEventListener('dblclick', handleDoubleClick);
  }, [editMode, previewMode]);

  // Click to select element (edit mode only)
  useEffect(() => {
    if (!editMode || previewMode) return;
    const handleClick = (e) => {
      // Don't select if clicking inside edit panel or modal
      if (e.target.closest('.edit-panel') || e.target.closest('.modal-overlay') || e.target.closest('.element-prop-panel')) return;
      
      const textTarget = e.target.closest('[data-editable]');
      const imgContainer = e.target.closest('[data-editable-image]');
      const imgTarget = e.target.tagName === 'IMG' ? e.target : null;
      
      const target = textTarget || imgContainer || imgTarget;
      if (target) {
        // Remove previous selection
        document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
        target.classList.add('selected-element');
        setSelectedElement(target);
      } else {
        document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
        setSelectedElement(null);
      }
    };
    document.addEventListener('click', handleClick);
    return () => document.removeEventListener('click', handleClick);
  }, [editMode, previewMode]);

  // Drag functionality
  useEffect(() => {
    if (!editMode || previewMode) return;
    let dragging = null;
    let startX, startY, startTransform;

    const handleMouseDown = (e) => {
      const target = e.target.closest('.selected-element');
      if (!target) return;
      // Don't drag while editing text
      if (target.contentEditable === 'true') return;
      
      dragging = target;
      startX = e.clientX;
      startY = e.clientY;
      
      const transform = getComputedStyle(target).transform;
      if (transform && transform !== 'none') {
        const matrix = new DOMMatrix(transform);
        startTransform = { x: matrix.m41, y: matrix.m42 };
      } else {
        startTransform = { x: 0, y: 0 };
      }
      
      e.preventDefault();
    };

    const handleMouseMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const newX = startTransform.x + dx;
      const newY = startTransform.y + dy;
      dragging.style.transform = `translate(${newX}px, ${newY}px)`;
    };

    const handleMouseUp = () => {
      if (dragging) {
        // Save position
        const key = dragging.getAttribute('data-style-key') || dragging.getAttribute('data-editable-image');
        if (key) {
          const transform = dragging.style.transform;
          setElementStyles(prev => {
            const updated = { ...prev, [key]: { ...prev[key], transform } };
            if (!previewMode) localStorage.setItem('moses_elementStyles', JSON.stringify(updated));
            return updated;
          });
        }
        dragging = null;
      }
    };

    document.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
    
    return () => {
      document.removeEventListener('mousedown', handleMouseDown);
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
    };
  }, [editMode, previewMode]);

  // Save editable content
  const saveEditableContent = useCallback(() => {
    const elements = document.querySelectorAll('[data-editable]');
    const content = {};
    elements.forEach(el => {
      const key = el.getAttribute('data-editable');
      content[key] = el.innerHTML;
    });
    setEditableContent(content);
    localStorage.setItem('moses_editableContent', JSON.stringify(content));
  }, []);

  // Restore editable content on load
  useEffect(() => {
    if (showSplash) return;
    Object.entries(editableContent).forEach(([key, value]) => {
      const el = document.querySelector(`[data-editable="${key}"]`);
      if (el) el.innerHTML = value;
    });
  }, [showSplash]);

  // In preview mode, force load all saved edits (no edit UI)
  useEffect(() => {
    if (previewMode && !showSplash) {
      // Apply text content from localStorage
      const savedContent = localStorage.getItem('moses_editableContent');
      if (savedContent) {
        const content = JSON.parse(savedContent);
        Object.entries(content).forEach(([key, value]) => {
          const el = document.querySelector(`[data-editable="${key}"]`);
          if (el) el.innerHTML = value;
        });
      }
      // Apply element styles
      const savedStyles = localStorage.getItem('moses_elementStyles');
      if (savedStyles) {
        const styles = JSON.parse(savedStyles);
        Object.entries(styles).forEach(([key, style]) => {
          const el = document.querySelector(`[data-style-key="${key}"]`) || 
                     document.querySelector(`[data-editable-image="${key}"]`);
          if (el) {
            if (style.color) el.style.color = style.color;
            if (style.fontSize) el.style.fontSize = `${style.fontSize}px`;
            if (style.transform) el.style.transform = style.transform;
          }
        });
      }
      // Apply image replacements
      const savedImages = localStorage.getItem('moses_imageReplacements');
      if (savedImages) {
        const images = JSON.parse(savedImages);
        Object.entries(images).forEach(([key, src]) => {
          const container = document.querySelector(`[data-editable-image="${key}"]`);
          if (container) {
            const img = container.querySelector('img');
            if (img) img.src = src;
          }
        });
      }
    }
  }, [previewMode, showSplash]);

  const openEditPanel = () => {
    if (previewMode) return;
    setEditPanelOpen(true);
    setEditMode(true);
  };

  const handleSave = () => {
    saveEditableContent();
    setEditPanelOpen(false);
    setEditMode(false);
    setSelectedElement(null);
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.contentEditable = 'false';
    });
    document.querySelectorAll('.selected-element').forEach(el => {
      el.classList.remove('selected-element');
    });
  };

  const handleCancel = () => {
    setEditPanelOpen(false);
    setEditMode(false);
    setSelectedElement(null);
    // Restore original content
    Object.entries(editableContent).forEach(([key, value]) => {
      const el = document.querySelector(`[data-editable="${key}"]`);
      if (el) el.innerHTML = value;
    });
    // Restore element styles - reload page is cleanest, but let's just remove inline styles that were edited
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.contentEditable = 'false';
    });
    document.querySelectorAll('.selected-element').forEach(el => {
      el.classList.remove('selected-element');
    });
    // Reload to fully reset all drag/style changes
    window.location.reload();
  };

  const handleUploadWork = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const newWork = {
        id: Date.now(),
        image: e.target.result,
        category: 'illustration',
        categoryLabel: '原创作品',
        title: file.name.replace(/\.[^.]+$/, ''),
        subtitle: '用户上传作品',
        desc: '这是一张上传的作品图片。'
      };
      const updated = [newWork, ...customWorks];
      setCustomWorks(updated);
      localStorage.setItem('moses_customWorks', JSON.stringify(updated));
    };
    reader.readAsDataURL(file);
  };

  const handleColorChange = (element, color) => {
    const key = element.getAttribute('data-style-key');
    if (key) {
      setElementStyles(prev => {
        const updated = { ...prev, [key]: { ...prev[key], color } };
        localStorage.setItem('moses_elementStyles', JSON.stringify(updated));
        return updated;
      });
    }
  };

  const handleFontSizeChange = (element, size) => {
    const key = element.getAttribute('data-style-key');
    if (key) {
      setElementStyles(prev => {
        const updated = { ...prev, [key]: { ...prev[key], fontSize: size } };
        localStorage.setItem('moses_elementStyles', JSON.stringify(updated));
        return updated;
      });
    }
  };

  const handleReplaceImage = (element, src) => {
    const container = element.closest('[data-editable-image]');
    const key = container ? container.getAttribute('data-editable-image') : null;
    if (key) {
      setImageReplacements(prev => {
        const updated = { ...prev, [key]: src };
        localStorage.setItem('moses_imageReplacements', JSON.stringify(updated));
        return updated;
      });
    }
  };

  const allWorks = [...customWorks, ...WORKS_DATA];
  const filteredWorks = worksFilter === 'all'
    ? allWorks
    : allWorks.filter(w => w.category === worksFilter);

  if (showSplash) {
    return <Splash onComplete={() => setShowSplash(false)} />;
  }

  return (
    <div>
      <Navbar
        scrolled={scrolled}
        onGearClick={openEditPanel}
        editMode={editMode}
        mobileMenuOpen={mobileMenuOpen}
        setMobileMenuOpen={setMobileMenuOpen}
        previewMode={previewMode}
        ownerMode={ownerMode}
      />
      <Hero />
      <About />
      <Works
        filter={worksFilter}
        setFilter={setWorksFilter}
        onWorkClick={setSelectedWork}
        works={filteredWorks}
      />
      <Skills />
      <Contact />
      <Footer />

      <WorkModal work={selectedWork} onClose={() => setSelectedWork(null)} />

      {!previewMode && ownerMode && (
        <>
          <EditPanel
            isOpen={editPanelOpen}
            onClose={handleSave}
            theme={theme}
            setTheme={setThemeState}
            primaryColor={primaryColor}
            setPrimaryColor={setPrimaryColorState}
            fontSize={fontSize}
            setFontSize={setFontSizeState}
            onUploadWork={handleUploadWork}
            customWorks={customWorks}
            onSave={handleSave}
            onCancel={handleCancel}
            onPublish={() => {
              saveEditableContent();
              setPublishOpen(true);
            }}
          />

          <ElementPropertyPanel
            element={selectedElement}
            onClose={() => {
              document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
              setSelectedElement(null);
            }}
            onColorChange={handleColorChange}
            onFontSizeChange={handleFontSizeChange}
            onReplaceImage={handleReplaceImage}
            editMode={editMode}
          />

          <PublishModal
            isOpen={publishOpen}
            onClose={() => setPublishOpen(false)}
            shareUrl={shareUrl}
          />

          {editMode && (
            <div className="editable-hint">
              编辑模式：双击文字修改 · 单击选中改色/字号 · 拖动调位置 · 图片可替换
            </div>
          )}
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
